<!DOCTYPE html>
<html>
<head>
    <title>Abuzar Battery Service</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #f5f5f5;
        }

        /* Navbar */
        .navbar {
            background: #111;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }

        /* Slider */
        .slider {
            width: 100%;
            height: 300px;
            overflow: hidden;
            position: relative;
            background: #000;
        }

        .slides {
            display: flex;
            width: 300%;
            animation: slide 9s infinite;
        }

        .slide {
            width: 100%;
            text-align: center;
            color: white;
            font-size: 30px;
            padding-top: 100px;
        }

        .slide:nth-child(1) { background: red; }
        .slide:nth-child(2) { background: green; }
        .slide:nth-child(3) { background: blue; }

        @keyframes slide {
            0% { margin-left: 0; }
            33% { margin-left: -100%; }
            66% { margin-left: -200%; }
            100% { margin-left: 0; }
        }

        /* Products */
        .products {
            padding: 20px;
            text-align: center;
        }

        .card {
            display: inline-block;
            width: 200px;
            background: white;
            margin: 10px;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        .btn {
            background: green;
            color: white;
            padding: 10px;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            background: darkgreen;
        }

        /* Footer */
        .footer {
            background: #111;
            color: white;
            padding: 15px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="navbar">
        Abuzar Battery Service
    </div>

    <!-- Slider -->
    <div class="slider">
        <div class="slides">
            <div class="slide">Osaka Battery 🔋</div>
            <div class="slide">AGS Battery 🔋</div>
            <div class="slide">Phoenix Battery 🔋</div>
        </div>
    </div>

    <!-- Products -->
    <div class="products">
        <h2>Our Batteries</h2>

        <div class="card">
            <h3>Osaka</h3>
            <button class="btn" onclick="order()">Order Now</button>
        </div>

        <div class="card">
            <h3>AGS</h3>
            <button class="btn" onclick="order()">Order Now</button>
        </div>

        <div class="card">
            <h3>Phoenix</h3>
            <button class="btn" onclick="order()">Order Now</button>
        </div>

    </div>

    <!-- Contact -->
    <div class="footer">
        📍 Gulshan-e-Ravi A Block, Lahore <br>
        📞 03281059
    </div>

    <script>
        function order() {
            alert("Order feature coming soon 😄");
        }
    </script>

</body>
</html>
<h1>Abuzar Battery Service</h1>

<p>Best Car & UPS Batteries in Lahore</p>
