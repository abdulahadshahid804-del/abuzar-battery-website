<!DOCTYPE html>
<html>
<head>
<title>Abuzar Battery Service</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:Arial;background:#f4f7fb;}

.topbar{
background:#0b3d91;color:white;padding:8px;text-align:center;
}

.header{
display:flex;justify-content:space-between;
align-items:center;padding:15px;background:white;
}

.logo{
font-size:22px;font-weight:bold;color:#0b3d91;cursor:pointer;
}

.btn{
background:#0b3d91;color:white;padding:8px 15px;
border:none;cursor:pointer;margin:5px;
}

.search{
text-align:center;padding:10px;
}
.search input{
padding:8px;width:60%;
}

/* BRANDS */
.brands{
display:flex;flex-wrap:wrap;justify-content:center;padding:15px;
}
.brand{
background:white;width:130px;margin:10px;padding:10px;
text-align:center;border-radius:10px;box-shadow:0 0 10px #ddd;
cursor:pointer;
}

/* CATEGORIES */
.categories{
display:flex;flex-wrap:wrap;justify-content:center;padding:15px;
}
.cat{
background:white;width:140px;margin:10px;padding:10px;
text-align:center;border-radius:10px;box-shadow:0 0 10px #ddd;
}

/* PRODUCTS */
.products{display:none;padding:20px;}
.grid{
display:flex;flex-wrap:wrap;justify-content:center;
}
.card{
background:white;width:200px;margin:10px;padding:10px;
text-align:center;border-radius:10px;box-shadow:0 0 10px #ddd;
}
.card img{width:100%;}

/* WHATSAPP */
.whatsapp{
position:fixed;bottom:20px;right:20px;
background:#25D366;color:white;padding:15px;
border-radius:50%;
text-decoration:none;
}
</style>
</head>

<body>

<div class="topbar">
📍 Gulshan-e-Ravi Lahore | 📞 03014681059
</div>

<div class="header">
<div class="logo" onclick="goHome()">ABUZAR BATTERY 🔋</div>
<button class="btn" onclick="showCart()">🛒 Cart</button>
</div>

<div class="search">
<input type="text" id="search" placeholder="Search battery..." onkeyup="searchProduct()">
</div>

<!-- BRANDS -->
<div id="brands" class="brands">
<div class="brand" onclick="showBrand('osaka')">OSAKA</div>
<div class="brand" onclick="showBrand('ags')">AGS</div>
<div class="brand" onclick="showBrand('phoenix')">PHOENIX</div>
<div class="brand" onclick="showBrand('exide')">EXIDE</div>
<div class="brand" onclick="showBrand('volta')">VOLTA</div>
<div class="brand" onclick="showBrand('daewoo')">DAEWOO</div>
</div>

<!-- CATEGORIES -->
<div class="categories">
<div class="cat">UPS Batteries</div>
<div class="cat">Car Batteries</div>
<div class="cat">Solar Batteries</div>
<div class="cat">Dry Batteries</div>
<div class="cat">Deep Cycle Batteries</div>
</div>

<!-- PRODUCTS -->
<div id="products" class="products">
<button class="btn" onclick="goHome()">⬅ Back</button>
<h2 id="brandTitle" style="text-align:center;"></h2>
<div class="grid" id="productList"></div>
</div>

<a class="whatsapp" href="#" onclick="sendCartWhatsApp()">💬</a>

<script>

let cart=[];

let data={
osaka:["NS40","NS60","NS65","TA-1200","TA-1500","TA-1800"],
ags:["GR-46","GR-65","GR-70","SP-180","GX-175","GX-200"],
phoenix:["XP-50","XP-70","PX-150","PX-200T"],
exide:["N55","N65","HP150","TR2500"],
volta:["T-125","T-150","T-180"],
daewoo:["DL-50","DL-60","DLS-65"]
};

function showBrand(brand){
document.getElementById("brands").style.display="none";
document.querySelector(".categories").style.display="none";
document.getElementById("products").style.display="block";

document.getElementById("brandTitle").innerText=brand.toUpperCase();

let list=document.getElementById("productList");
list.innerHTML="";

data[brand].forEach(model=>{
list.innerHTML+=`
<div class="card">
<img src="https://via.placeholder.com/150">
<h3>${brand.toUpperCase()} ${model}</h3>

<button class="btn" onclick="buyNow('${brand} ${model}')">Buy Now</button>
<button class="btn" onclick="addToCart('${brand} ${model}')">Add to Cart</button>

</div>`;
});
}

function goHome(){
document.getElementById("brands").style.display="flex";
document.querySelector(".categories").style.display="flex";
document.getElementById("products").style.display="none";
}

function addToCart(p){
cart.push(p);
alert(p+" added to cart 🛒");
}

function showCart(){
if(cart.length===0) alert("Cart empty");
else alert("Cart:\n"+cart.join("\n"));
}

function buyNow(product){
let msg="Assalamualaikum, mujhe ye battery chahiye: "+product;
window.open("https://wa.me/923014681059?text="+encodeURIComponent(msg));
}

function sendCartWhatsApp(){
if(cart.length===0){alert("Cart empty");return;}
let msg="Assalamualaikum, mujhe ye batteries chahiye:\n\n"+cart.join("\n");
window.open("https://wa.me/923014681059?text="+encodeURIComponent(msg));
}

function searchProduct(){
let input=document.getElementById("search").value.toLowerCase();

let list=document.getElementById("productList");
list.innerHTML="";

let found=false;

for(let brand in data){
data[brand].forEach(model=>{
let full=brand+" "+model;
if(full.toLowerCase().includes(input)){
found=true;
list.innerHTML+=`
<div class="card">
<img src="https://via.placeholder.com/150">
<h3>${full.toUpperCase()}</h3>
<button class="btn" onclick="buyNow('${full}')">Buy Now</button>
<button class="btn" onclick="addToCart('${full}')">Add to Cart</button>
</div>`;
}
});
}

if(found){
document.getElementById("brands").style.display="none";
document.querySelector(".categories").style.display="none";
document.getElementById("products").style.display="block";
document.getElementById("brandTitle").innerText="Search Results";
}
}

</script>

</body>
</html>
