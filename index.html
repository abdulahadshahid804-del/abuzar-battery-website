<!DOCTYPE html>
<html>
<head>
<title>Abuzar Battery Service</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:Arial;background:#f4f7fb;}

/* TOP BAR */
.topbar{
background:#0b3d91;
color:white;
padding:8px;
text-align:center;
}

/* HEADER */
.header{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px;
background:white;
}

/* SEARCH */
.search{
padding:10px;
width:90%;
margin:10px auto;
display:block;
}

/* BRAND SLIDER */
.slider{
overflow:hidden;
background:white;
padding:10px;
}
.track{
display:flex;
animation:scroll 15s linear infinite;
}
.slide{
min-width:120px;
text-align:center;
font-weight:bold;
color:#0b3d91;
}
@keyframes scroll{
0%{transform:translateX(0);}
100%{transform:translateX(-50%);}
}

/* CATEGORIES */
.categories{
display:flex;
flex-wrap:wrap;
justify-content:center;
padding:10px;
}
.cat{
background:white;
margin:10px;
padding:10px;
width:140px;
text-align:center;
border-radius:10px;
box-shadow:0 0 10px #ddd;
}
.cat img{width:80px;}

/* BRANDS */
.brands{
display:flex;
flex-wrap:wrap;
justify-content:center;
}
.brand{
background:white;
margin:10px;
padding:10px;
width:130px;
text-align:center;
border-radius:10px;
box-shadow:0 0 10px #ddd;
cursor:pointer;
}
.brand img{width:80px;}

/* PRODUCTS */
.products{
display:none;
padding:20px;
}
.grid{
display:flex;
flex-wrap:wrap;
justify-content:center;
}
.card{
background:white;
margin:10px;
padding:10px;
width:180px;
text-align:center;
border-radius:10px;
box-shadow:0 0 10px #ddd;
}
.card img{width:100%;}

/* BUTTON */
.btn{
background:#0b3d91;
color:white;
padding:8px;
border:none;
cursor:pointer;
margin-top:5px;
}

/* WHATSAPP */
.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
color:white;
padding:15px;
border-radius:50%;
text-decoration:none;
}

</style>
</head>

<body>

<div class="topbar">
📍 Lahore | 📞 03014681059
</div>

<div class="header">
<h2>ABUZAR BATTERY 🔋</h2>
<button onclick="showCart()">🛒</button>
</div>

<input class="search" placeholder="Search battery..." onkeyup="searchProduct(this.value)">

<!-- SLIDER -->
<div class="slider">
<div class="track">
<div class="slide">OSAKA</div>
<div class="slide">AGS</div>
<div class="slide">PHOENIX</div>
<div class="slide">EXIDE</div>
<div class="slide">VOLTA</div>
<div class="slide">DAEWOO</div>
</div>
</div>

<!-- CATEGORIES -->
<div class="categories">
<div class="cat"><img src="https://via.placeholder.com/80"><p>UPS Batteries</p></div>
<div class="cat"><img src="https://via.placeholder.com/80"><p>Car Batteries</p></div>
<div class="cat"><img src="https://via.placeholder.com/80"><p>Solar Batteries</p></div>
<div class="cat"><img src="https://via.placeholder.com/80"><p>Dry Batteries</p></div>
<div class="cat"><img src="https://via.placeholder.com/80"><p>Deep Cycle Batteries</p></div>
</div>

<!-- BRANDS -->
<div id="brands" class="brands">

<div class="brand" onclick="showBrand('osaka')">
<img src="https://via.placeholder.com/100">
<p>OSAKA</p>
</div>

<div class="brand" onclick="showBrand('ags')">
<img src="https://via.placeholder.com/100">
<p>AGS</p>
</div>

<div class="brand" onclick="showBrand('phoenix')">
<img src="https://via.placeholder.com/100">
<p>PHOENIX</p>
</div>

<div class="brand" onclick="showBrand('exide')">
<img src="https://via.placeholder.com/100">
<p>EXIDE</p>
</div>

<div class="brand" onclick="showBrand('volta')">
<img src="https://via.placeholder.com/100">
<p>VOLTA</p>
</div>

<div class="brand" onclick="showBrand('daewoo')">
<img src="https://via.placeholder.com/100">
<p>DAEWOO</p>
</div>

</div>

<!-- PRODUCTS -->
<div id="products" class="products">
<h2 id="title"></h2>
<div id="list" class="grid"></div>
</div>

<a class="whatsapp" href="#" onclick="sendCart()">💬</a>

<script>

let cart=[];

let data={
osaka:["NS60","TA-1200","TA-1500","TA-1800"],
ags:["GR-65","SP-180","GX-175"],
phoenix:["XP-50","XP-70"],
exide:["N55","N65"],
volta:["T-125","T-150"],
daewoo:["DL-50","DL-60"]
};

function showBrand(b){
document.getElementById("brands").style.display="none";
document.getElementById("products").style.display="block";
document.getElementById("title").innerText=b.toUpperCase();

let html="";
data[b].forEach(p=>{
html+=`
<div class="card">
<img src="https://via.placeholder.com/150">
<h3>${b.toUpperCase()} ${p}</h3>
<button class="btn" onclick="addCart('${b} ${p}')">Add</button>
</div>`;
});

document.getElementById("list").innerHTML=html;
}

function addCart(p){
cart.push(p);
alert("Added: "+p);
}

function showCart(){
alert(cart.length?cart.join("\n"):"Cart empty");
}

function sendCart(){
if(cart.length==0){alert("Cart empty");return;}
let msg="Order:\n"+cart.join("\n");
window.open("https://wa.me/923014681059?text="+encodeURIComponent(msg));
}

function searchProduct(q){
q=q.toLowerCase();
let cards=document.querySelectorAll(".card");
cards.forEach(c=>{
c.style.display=c.innerText.toLowerCase().includes(q)?"block":"none";
});
}

</script>

</body>
</html>
