<!DOCTYPE html>
<html>
<head>
<title>Abuzar Battery Service</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:Arial;background:#f4f7fb;}

.header{
display:flex;justify-content:space-between;
padding:15px;background:white;
}

.logo{font-size:22px;font-weight:bold;color:#0b3d91;}

.btn{background:#0b3d91;color:white;padding:8px 15px;border:none;cursor:pointer;}

/* BRAND GRID */
.brands{
display:flex;flex-wrap:wrap;justify-content:center;
padding:20px;
}

.brand{
background:white;
width:140px;
margin:10px;
padding:10px;
text-align:center;
border-radius:10px;
box-shadow:0 0 10px #ddd;
cursor:pointer;
}

.brand img{width:80px;}

/* CATEGORIES */
.categories{
display:flex;flex-wrap:wrap;justify-content:center;
padding:20px;
}

.cat{
background:white;
width:150px;
margin:10px;
padding:10px;
text-align:center;
border-radius:10px;
box-shadow:0 0 10px #ddd;
}

.cat img{width:80px;}

/* PRODUCTS */
.products{
padding:20px;
display:none;
}

.grid{
display:flex;flex-wrap:wrap;justify-content:center;
}

.card{
background:white;
width:200px;
margin:10px;
padding:10px;
text-align:center;
border-radius:10px;
box-shadow:0 0 10px #ddd;
}

.card img{width:100%;}

</style>
</head>

<body>

<div class="header">
<div class="logo">ABUZAR BATTERY 🔋</div>
<button class="btn" onclick="goHome()">🏠 Home</button>
</div>

<!-- BRANDS -->
<div id="brands" class="brands">

<div class="brand" onclick="showBrand('osaka')">
<img src="https://via.placeholder.com/100">
<p>OSAKA</p>
</div>

<div class="brand" onclick="showBrand('ags')">
<img src="https://via.placeholder.com/100">
<p>AGS</p>
</div>

<div class="brand" onclick="showBrand('phoenix')">
<img src="https://via.placeholder.com/100">
<p>PHOENIX</p>
</div>

<div class="brand" onclick="showBrand('exide')">
<img src="https://via.placeholder.com/100">
<p>EXIDE</p>
</div>

<div class="brand" onclick="showBrand('volta')">
<img src="https://via.placeholder.com/100">
<p>VOLTA</p>
</div>

<div class="brand" onclick="showBrand('daewoo')">
<img src="https://via.placeholder.com/100">
<p>DAEWOO</p>
</div>

</div>

<!-- CATEGORIES -->
<div class="categories">
<div class="cat"><img src="https://via.placeholder.com/80"><p>Car Batteries</p></div>
<div class="cat"><img src="https://via.placeholder.com/80"><p>UPS Batteries</p></div>
<div class="cat"><img src="https://via.placeholder.com/80"><p>Solar Batteries</p></div>
<div class="cat"><img src="https://via.placeholder.com/80"><p>Dry Batteries</p></div>
<div class="cat"><img src="https://via.placeholder.com/80"><p>Deep Cycle Batteries</p></div>
</div>

<!-- PRODUCTS -->
<div id="products" class="products">
<h2 id="brandTitle" style="text-align:center;"></h2>

<div class="grid" id="productList"></div>
</div>

<script>

let data = {
osaka: ["NS60","TA-1800","TA-1200","TA-1500"],
ags: ["GR-65","SP-180","GX-175","GX-200"],
phoenix: ["XP-50","XP-70","PX-150"],
exide: ["N55","N65","HP150"],
volta: ["T-125","T-150"],
daewoo: ["DL-50","DL-60"]
};

function showBrand(brand){
document.getElementById("brands").style.display="none";
document.getElementById("products").style.display="block";

document.getElementById("brandTitle").innerText = brand.toUpperCase();

let list = document.getElementById("productList");
list.innerHTML = "";

data[brand].forEach(model=>{
list.innerHTML += `
<div class="card">
<img src="https://via.placeholder.com/150">
<h3>${brand.toUpperCase()} ${model}</h3>
</div>
`;
});
}

function goHome(){
document.getElementById("brands").style.display="flex";
document.getElementById("products").style.display="none";
}

</script>

</body>
</html>
