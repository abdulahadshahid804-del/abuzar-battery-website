<!DOCTYPE html>
<html>
<head>
<title>Abuzar Battery Service</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#e3f2fd,#f4f7fb);
}

/* TOP */
.topbar{
background:#0b3d91;color:white;padding:8px;text-align:center;
}

/* HEADER */
.header{
display:flex;justify-content:space-between;
align-items:center;padding:15px;background:white;
box-shadow:0 2px 10px #ddd;
}

.logo{
font-size:22px;font-weight:bold;color:#0b3d91;cursor:pointer;
}

.user-box{
display:flex;align-items:center;
}

/* BUTTON */
.btn{
background:#0b3d91;color:white;padding:8px 15px;
border:none;cursor:pointer;margin:5px;border-radius:20px;
}

/* LOGIN */
.login-box{
position:fixed;
top:50%;left:50%;
transform:translate(-50%,-50%);
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 0 20px #aaa;
display:none;
}
.login-box input{
display:block;
margin:10px 0;
padding:8px;
width:200px;
}

/* SEARCH */
.search{text-align:center;padding:10px;}
.search input{
padding:10px;width:60%;
border-radius:20px;border:1px solid #ccc;
}

/* VIEW */
.view-btns{text-align:center;}

/* ANIMATION */
.slider{overflow:hidden;background:white;padding:10px;}
.track{display:flex;gap:40px;animation:scroll 18s linear infinite;}
.slide{font-weight:bold;color:#0b3d91;}
@keyframes scroll{
0%{transform:translateX(100%);}
100%{transform:translateX(-100%);}
}

/* HERO */
.hero{text-align:center;padding:30px;}

/* CATEGORIES */
.categories{
display:flex;flex-wrap:wrap;justify-content:center;padding:15px;
}
.cat{
background:white;width:140px;margin:10px;padding:10px;
text-align:center;border-radius:15px;
box-shadow:0 0 15px #ddd;
}

/* BRANDS */
.brands{
display:flex;flex-wrap:wrap;justify-content:center;padding:15px;
}
.brand{
background:white;width:130px;margin:10px;padding:10px;
text-align:center;border-radius:15px;
box-shadow:0 0 15px #ddd;
cursor:pointer;
}

/* PRODUCTS */
.products{display:none;padding:20px;}
.grid{display:flex;flex-wrap:wrap;justify-content:center;}

.card{
background:white;width:200px;margin:10px;padding:10px;
text-align:center;border-radius:15px;
box-shadow:0 0 15px #ddd;
cursor:pointer;
}
.card img{width:100%;}

/* DETAIL */
.detail{display:none;padding:20px;}
.detail-box{
display:flex;flex-wrap:wrap;background:white;
padding:20px;border-radius:15px;
box-shadow:0 0 15px #ddd;
}
.detail-box img{width:300px;}
.detail-info{flex:1;padding:20px;}

.qty{display:flex;align-items:center;}
.qty button{margin:5px;}

/* FOOTER */
.footer{text-align:center;padding:20px;color:#666;}

/* WHATSAPP */
.whatsapp{
position:fixed;bottom:20px;right:20px;
background:#25D366;color:white;padding:15px;
border-radius:50%;
}
</style>
</head>

<body>

<div class="topbar">
📍 Gulshan-e-Ravi Lahore | 📞 03014681059
</div>

<div class="header">
<div class="logo" onclick="goHome()">Abuzar Battery 🔋</div>

<div class="user-box">
<span id="username"></span>
<button class="btn" onclick="openLogin()">Login</button>
<button class="btn" onclick="logout()">Logout</button>
<button class="btn" onclick="showCart()">🛒</button>
</div>
</div>

<!-- LOGIN -->
<div class="login-box" id="loginBox">
<h3>Login / Signup</h3>
<input type="text" id="name" placeholder="Enter Name">
<button class="btn" onclick="login()">Continue</button>
</div>

<div class="search">
<input type="text" placeholder="Search battery...">
</div>

<div class="view-btns">
<button class="btn" onclick="setGrid()">Grid</button>
<button class="btn" onclick="setList()">List</button>
</div>

<!-- ANIMATION -->
<div class="slider">
<div class="track">
<div class="slide">OSAKA</div>
<div class="slide">AGS</div>
<div class="slide">PHOENIX</div>
<div class="slide">EXIDE</div>
<div class="slide">VOLTA</div>
<div class="slide">DAEWOO</div>
</div>
</div>

<!-- HERO -->
<div class="hero">
<h1>Pakistan ki Best Battery Service 🔋</h1>
</div>

<!-- CATEGORIES -->
<div class="categories">
<div class="cat">UPS Batteries</div>
<div class="cat">Car Batteries</div>
<div class="cat">Solar Batteries</div>
<div class="cat">Dry Batteries</div>
<div class="cat">Deep Cycle Batteries</div>
</div>

<!-- BRANDS -->
<div id="brands" class="brands">
<div class="brand" onclick="showBrand('osaka')">OSAKA</div>
<div class="brand" onclick="showBrand('ags')">AGS</div>
<div class="brand" onclick="showBrand('phoenix')">PHOENIX</div>
<div class="brand" onclick="showBrand('exide')">EXIDE</div>
<div class="brand" onclick="showBrand('volta')">VOLTA</div>
<div class="brand" onclick="showBrand('daewoo')">DAEWOO</div>
</div>

<!-- PRODUCTS -->
<div id="products" class="products">
<button class="btn" onclick="goHome()">⬅ Back</button>
<h2 id="brandTitle"></h2>
<div class="grid" id="productList"></div>
</div>

<!-- DETAIL -->
<div id="detail" class="detail">
<button class="btn" onclick="backToProducts()">⬅ Back</button>
<div class="detail-box">
<img id="dimg">
<div class="detail-info">
<h2 id="dname"></h2>

<div class="qty">
<button onclick="dec()">-</button>
<span id="qty">1</span>
<button onclick="inc()">+</button>
</div>

<button class="btn" onclick="addDetailCart()">Add to Cart</button>
<button class="btn" onclick="buyDetail()">Buy Now</button>
</div>
</div>
</div>

<div class="footer">© 2026 Abuzar Battery</div>
<a class="whatsapp" onclick="sendCartWhatsApp()">💬</a>

<script>
let cart=[];
let current="";
let q=1;

/* LOGIN SYSTEM */
function openLogin(){
document.getElementById("loginBox").style.display="block";
}

function login(){
let name=document.getElementById("name").value;
localStorage.setItem("user",name);
document.getElementById("loginBox").style.display="none";
showUser();
}

function showUser(){
let u=localStorage.getItem("user");
if(u){
document.getElementById("username").innerText="Hi, "+u;
}
}

function logout(){
localStorage.removeItem("user");
location.reload();
}

showUser();

/* DATA */
let data={
osaka:["NS40","NS60"],
ags:["GR-65"],
phoenix:["XP-70"],
exide:["N55"],
volta:["T-125"],
daewoo:["DL-60"]
};

function showBrand(b){
document.getElementById("brands").style.display="none";
document.querySelector(".categories").style.display="none";
document.getElementById("products").style.display="block";
document.getElementById("brandTitle").innerText=b.toUpperCase();

let list=document.getElementById("productList");
list.innerHTML="";

data[b].forEach(m=>{
list.innerHTML+=`
<div class="card" onclick="openDetail('${b} ${m}')">
<img src="https://via.placeholder.com/200">
<h3>${b.toUpperCase()} ${m}</h3>
</div>`;
});
}

function openDetail(p){
current=p;
q=1;
document.getElementById("products").style.display="none";
document.getElementById("detail").style.display="block";
document.getElementById("dname").innerText=p;
document.getElementById("dimg").src="https://via.placeholder.com/300";
document.getElementById("qty").innerText=q;
}

function backToProducts(){
document.getElementById("detail").style.display="none";
document.getElementById("products").style.display="block";
}

function inc(){q++;document.getElementById("qty").innerText=q;}
function dec(){if(q>1)q--;document.getElementById("qty").innerText=q;}

function addDetailCart(){
for(let i=0;i<q;i++) cart.push(current);
alert("Added to cart");
}

function buyDetail(){
window.open("https://wa.me/923014681059?text="+current+" x"+q);
}

function showCart(){
alert(cart.length?cart.join("\n"):"Cart empty");
}

function sendCartWhatsApp(){
window.open("https://wa.me/923014681059?text="+cart.join("\n"));
}

function goHome(){location.reload();}

function setGrid(){document.getElementById("productList").classList.remove("list");}
function setList(){document.getElementById("productList").classList.add("list");}
</script>

</body>
</html>
