
<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cousin Core '26 - The Smash Roast Arena</title>
    <style>
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background: radial-gradient(circle at center, #1a052e, #05010d);
            color: #fff;
            min-height: 100vh;
            display: flex; flex-direction: column;
            align-items: center; justify-content: flex-start;
            overflow-x: hidden;
            perspective: 1200px;
            padding: 30px 10px;
        }

        h1 {
            font-size: 3rem; color: #ff4757;
            text-shadow: 0 0 20px rgba(255, 71, 87, 0.6);
            margin-bottom: 5px; transform: translateZ(50px);
            text-align: center;
        }

        .tagline {
            color: #ffa502; font-size: 1.1rem; margin-bottom: 30px; text-align: center;
        }

        /* Battle Arena Layout */
        .arena {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 1100px;
            gap: 20px;
            margin-top: 20px;
            transform-style: preserve-3d;
        }

        /* Team Columns */
        .team-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 30px;
            align-items: center;
            transform-style: preserve-3d;
        }

        /* 3D Fighter Card */
        .fighter-card {
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 280px;
            text-align: center;
            position: relative;
            transform-style: preserve-3d;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        /* Team Colors */
        .boys .fighter-card { border-color: #2ed573; }
        .girls .fighter-card { border-color: #ffa502; }

        /* Animation when getting hit */
        @keyframes hitShake {
            0% { transform: translateX(0) rotate(0deg); filter: brightness(1.5) sepia(1) hue-rotate(-50deg); }
            20% { transform: translateX(-15px) rotate(-5deg); }
            40% { transform: translateX(15px) rotate(5deg); }
            60% { transform: translateX(-10px) rotate(-3deg); }
            80% { transform: translateX(10px) rotate(3deg); }
            100% { transform: translateX(0) rotate(0deg); filter: none; }
        }

        .fighter-card.get-hit {
            animation: hitShake 0.4s ease-in-out;
            border-color: #ff4757 !important;
            box-shadow: 0 0 40px #ff4757 !important;
        }

        .avatar-box {
            width: 100%; height: 180px;
            display: flex; justify-content: center; align-items: center;
            transform: translateZ(30px);
        }

        .avatar-svg {
            width: 130px; height: 130px;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.4));
            transition: transform 0.3s ease;
        }

        .fighter-card:hover .avatar-svg {
            transform: scale(1.1) rotate(2deg);
        }

        .name {
            font-size: 1.8rem; font-weight: bold; margin: 10px 0;
            letter-spacing: 1px; text-transform: uppercase;
        }

        /* Health Bar / Roast Meter for Girls */
        .hp-container {
            width: 100%; background: #222; height: 12px;
            border-radius: 6px; overflow: hidden; margin-top: 10px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .hp-bar {
            width: 100%; height: 100%; background: linear-gradient(90deg, #ffa502, #ff4757);
            transition: width 0.3s ease;
        }

        .hp-text {
            font-size: 0.8rem; color: #a4b0be; margin-top: 4px;
        }

        /* Attack Controls for Boys */
        .attack-btn {
            background: linear-gradient(135deg, #2ed573, #1e90ff);
            color: white; border: none; padding: 10px 18px;
            font-weight: bold; border-radius: 12px; cursor: pointer;
            margin-top: 12px; width: 100%;
            transform: translateZ(20px); transition: all 0.2s;
            box-shadow: 0 5px 15px rgba(46, 213, 115, 0.4);
        }

        .attack-btn:hover {
            transform: translateZ(25px) scale(1.05);
            filter: brightness(1.2);
        }

        .attack-btn:active {
            transform: translateZ(10px) scale(0.95);
        }

        /* Projectile / Flying FX */
        .projectile {
            position: fixed; font-size: 2.5rem;
            z-index: 999; pointer-events: none;
            transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* Center Board for Logs */
        .vs-divider {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; font-size: 2rem; font-weight: 900;
            color: #ff4757; text-shadow: 0 0 10px rgba(255,71,87,0.5);
        }

        .log-box {
            background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px; padding: 15px; width: 220px; max-height: 250px;
            overflow-y: auto; font-size: 0.85rem; color: #ced6e0;
            margin-top: 20px; text-align: center; display: flex; flex-direction: column-reverse; gap: 5px;
        }

        .log-entry {
            animation: fadeIn 0.3s ease; padding: 4px; border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 768px) {
            .arena { flex-direction: column; align-items: center; }
            .vs-divider { margin: 20px 0; }
        }
    </style>
</head>
<body>

    <h1>COUSIN ROAST ARENA '26</h1>
    <p class="tagline">🔥 Ahad aur Basit ka attack! Larkiyon par funny roasts phenkein!</p>

    <div class="arena">
        
        <!-- ================= BOYS SIDE (ATTACKERS) ================= -->
        <div class="team-column boys">
            <h2 style="color: #2ed573;">Attackers 👦</h2>
            
            <!-- AHAD -->
            <div class="fighter-card" id="card-ahad">
                <div class="avatar-box">
                    <svg class="avatar-svg" viewBox="0 0 100 100">
                        <circle cx="50" cy="45" r="22" fill="#EAC086"/>
                        <path d="M20 75 C 20 60, 80 60, 80 75 L 80 100 L 20 100 Z" fill="#333"/>
                        <path d="M30 35 L 25 18 L 38 28 L 35 12 L 50 25 L 58 10 L 65 25 L 75 15 L 72 35 Z" fill="#111"/>
                        <circle cx="42" cy="45" r="3" fill="#111"/><circle cx="58" cy="45" r="3" fill="#111"/>
                        <path d="M45 55 C 50 58, 60 55, 62 52" stroke="#111" stroke-width="2" fill="none"/>
                    </svg>
                </div>
                <div class="name">Ahad</div>
                <button class="attack-btn" onclick="launchAttack('Ahad', '🍅', 'Laraib')">Laraib par Tamatar Phenko!</button>
                <button class="attack-btn" style="background:linear-gradient(135deg, #ff4757, #ff6b81)" onclick="launchAttack('Ahad', '💥', 'Sana')">Sana ko Roast Karo!</button>
            </div>

            <!-- BASIT -->
            <div class="fighter-card" id="card-basit">
                <div class="avatar-box">
                    <svg class="avatar-svg" viewBox="0 0 100 100">
                        <circle cx="50" cy="45" r="22" fill="#E5B581"/>
                        <path d="M20 75 C 20 60, 80 60, 80 75 L 80 100 L 20 100 Z" fill="#ff4757"/>
                        <path d="M28 38 C 30 20, 70 20, 72 38 Z" fill="#1a1a1a"/>
                        <path d="M30 50 C 30 70, 70 70, 70 50 Z" fill="#1a1a1a"/>
                        <circle cx="41" cy="45" r="6" fill="none" stroke="#fff" stroke-width="1.5"/>
                        <circle cx="59" cy="45" r="6" fill="none" stroke="#fff" stroke-width="1.5"/>
                    </svg>
                </div>
                <div class="name">Basit</div>
                <button class="attack-btn" onclick="launchAttack('Basit', '🎈', 'Laraib')">Laraib par Water Balloon!</button>
                <button class="attack-btn" style="background:linear-gradient(135deg, #ff4757, #ff6b81)" onclick="launchAttack('Basit', '🎤', 'Sana')">Sana par Mic Drop!</button>
            </div>
        </div>

        <!-- ================= CENTER BOARD ================= -->
        <div class="vs-divider">
            <div>VS</div>
            <div class="log-box" id="battle-log">
                <div class="log-entry">Fight Shuru Karein! Click the buttons!</div>
            </div>
        </div>

        <!-- ================= GIRLS SIDE (TARGETS) ================= -->
        <div class="team-column girls">
            <h2 style="color: #ffa502;">Victims 👧</h2>
            
            <!-- LARAIB -->
            <div class="fighter-card" id="card-laraib">
                <div class="avatar-box">
                    <svg class="avatar-svg" viewBox="0 0 100 100">
                        <circle cx="50" cy="45" r="20" fill="#F3D5AB"/>
                        <path d="M20 75 C 20 60, 80 60, 80 75 L 80 100 L 20 100 Z" fill="#8e44ad"/>
                        <path d="M28 35 C 20 50, 20 75, 35 90 L 65 90 C 80 75, 80 50, 72 35 Z" fill="#9b59b6" opacity="0.9"/>
                        <path d="M43 58 L 57 58" stroke="#333" stroke-width="2"/>
                    </svg>
                </div>
                <div class="name">Laraib</div>
                <div class="hp-container"><div class="hp-bar" id="hp-laraib"></div></div>
                <div class="hp-text">Attitude Level: <span id="hp-txt-laraib">100</span>%</div>
            </div>

            <!-- SANA -->
            <div class="fighter-card" id="card-sana">
                <div class="avatar-box">
                    <svg class="avatar-svg" viewBox="0 0 100 100">
                        <circle cx="50" cy="45" r="20" fill="#F7E0C1"/>
                        <path d="M20 75 C 20 60, 80 60, 80 75 L 80 100 L 20 100 Z" fill="#e67e22"/>
                        <circle cx="50" cy="22" r="7" fill="#111"/>
                        <path d="M30 38 C 30 20, 70 20, 70 38 Z" fill="#111"/>
                        <circle cx="50" cy="56" r="3" fill="none" stroke="#111" stroke-width="2"/>
                    </svg>
                </div>
                <div class="name">Sana</div>
                <div class="hp-container"><div class="hp-bar" id="hp-sana"></div></div>
                <div class="hp-text">Aesthetic Level: <span id="hp-txt-sana">100</span>%</div>
            </div>
        </div>

    </div>

    <script>
        // Data system for girls health/attitude meter
        const healthSystem = {
            Laraib: 100,
            Sana: 100
        };

        // Funny Roast Dialogue Database
        const funnyRoasts = {
            Ahad: [
                "Laraib ka attitude crash ho gaya!",
                "Ahad ne Sana ke filters ura diye!",
                "Laraib ka aesthetic mazaq ban gaya!"
            ],
            Basit: [
                "Basit ne Sana ki overacting pakar li!",
                "Laraib ka 3D nakhra khatam!",
                "Basit ke mic drop se Sana khamosh!"
            ]
        };

        function launchAttack(attacker, weapon, target) {
            // Get positions for 3D animation trajectory
            const attackerCard = document.getElementById(`card-${attacker.toLowerCase()}`);
            const targetCard = document.getElementById(`card-${target.toLowerCase()}`);
            
            const startRect = attackerCard.getBoundingClientRect();
            const endRect = targetCard.getBoundingClientRect();

            // Create flying emoji element
            const proj = document.createElement('div');
            proj.className = 'projectile';
            proj.innerText = weapon;
            proj.style.left = `${startRect.left + startRect.width/2}px`;
            proj.style.top = `${startRect.top + startRect.height/2}px`;
            document.body.appendChild(proj);

            // Animate flying across screen
            setTimeout(() => {
                proj.style.transform = `translate(${endRect.left - startRect.left}px, ${endRect.top - startRect.top}px) scale(1.5)`;
            }, 50);

            // On Impact
            setTimeout(() => {
                proj.remove();
                
                // Add shake effect to targeted girl card
                targetCard.classList.add('get-hit');
                setTimeout(() => targetCard.classList.remove('get-hit'), 400);

                // Reduce health/points
                healthSystem[target] = Math.max(0, healthSystem[target] - 15);
                document.getElementById(`hp-${target.toLowerCase()}`).style.width = `${healthSystem[target]}%`;
                document.getElementById(`hp-txt-${target.toLowerCase()}`).innerText = healthSystem[target];

                // Add to Battle log screen
                const logBox = document.getElementById('battle-log');
                const randomLines = funnyRoasts[attacker];
                const line = randomLines[Math.floor(Math.random() * randomLines.length)];
                
                const entry = document.createElement('div');
                entry.className = 'log-entry';
                entry.innerHTML = `<strong>${attacker}</strong> ne ${weapon} maara! <br><span style="color:#ffa502">${line}</span>`;
                logBox.appendChild(entry);

                // Speak via Voice system
                speakLine(`${attacker} ne mara! ${line}`);

                // Check if totally roasted
                if (healthSystem[target] === 0) {
                    entry.innerHTML += `<br><span style="color:#ff4757; font-weight:bold;">🏆 ${target} mukammal roast ho gayin!</span>`;
                    healthSystem[target] = 100; // Reset for unlimited fun
                    setTimeout(() => {
                        document.getElementById(`hp-${target.toLowerCase()}`).style.width = `100%`;
                        document.getElementById(`hp-txt-${target.toLowerCase()}`).innerText = 100;
                    }, 2000);
                }

            }, 650);
        }

        function speakLine(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            const voices = window.speechSynthesis.getVoices();
            const localVoice = voices.find(v => v.lang.includes('ur') || v.lang.includes('hi'));
            if (localVoice) utterance.voice = localVoice;
            utterance.rate = 1.1;
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
